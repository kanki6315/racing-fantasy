services:
  postgres:
    image: postgres:18
    container_name: endurance-fantasy-db
    environment:
      POSTGRES_USER: endurance
      POSTGRES_PASSWORD: endurance
      POSTGRES_DB: endurance_fantasy
    ports:
      - "5432:5432"
    volumes:
      - endurance_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U endurance -d endurance_fantasy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  endurance_pgdata:
