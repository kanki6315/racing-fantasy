<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Endurance Fantasy mark: condensed two-tone "EF" — white E (ENDURANCE) + IMSA-red F (FANTASY) -->
  <rect width="48" height="48" rx="10" fill="#0a0b0d"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="9.5" fill="none" stroke="#1f242a"/>
  <!-- E (ink white) -->
  <g fill="#ffffff">
    <rect x="10" y="12" width="4.5" height="24" rx="0.5"/>
    <rect x="10" y="12" width="12" height="4" rx="0.5"/>
    <rect x="10" y="22" width="10" height="4" rx="0.5"/>
    <rect x="10" y="32" width="12" height="4" rx="0.5"/>
  </g>
  <!-- F (brand red) -->
  <g fill="#e10600">
    <rect x="26.5" y="12" width="4.5" height="24" rx="0.5"/>
    <rect x="26.5" y="12" width="12" height="4" rx="0.5"/>
    <rect x="26.5" y="22" width="10" height="4" rx="0.5"/>
  </g>
</svg>
